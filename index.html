<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Vocabulary App — Unit 1–3</title>
<style>
:root{
  --bg:#f3f8fd; --card:#ffffff; --text:#1b2a3a; --muted:#64748b;
  --primary:#4a90d9; --primary-dark:#3577bd; --primary-soft:#dfeefc; --primary-soft2:#eef6fe;
  --border:#dbe7f4; --ok:#178a4c; --ok-bg:#e6f7ed; --bad:#c93c3c; --bad-bg:#fdeceb;
  --warn:#b8860b; --warn-bg:#fdf6e3;
  --shadow:0 3px 14px rgba(38,86,145,.08);
}
[data-theme="dark"]{
  --bg:#0f1720; --card:#17222e; --text:#e6eef7; --muted:#93a6bb;
  --primary:#6aa9e9; --primary-dark:#8bbdf0; --primary-soft:#1f3348; --primary-soft2:#1a2a3b;
  --border:#26374a; --ok:#4bd486; --ok-bg:#13301f; --bad:#ff8585; --bad-bg:#3a1c1c;
  --warn:#e5b84b; --warn-bg:#332a12;
  --shadow:0 3px 14px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:19px;margin:26px 0 12px}
h3{font-size:16px;margin:0 0 8px}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
a{color:var(--primary)}

.layout{display:flex;min-height:100vh}
.sidebar{
  width:238px;flex:0 0 238px;background:var(--card);border-right:1px solid var(--border);
  padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{font-weight:700;font-size:17px;color:var(--primary);margin-bottom:3px}
.brand-sub{font-size:11.5px;color:var(--muted);margin-bottom:20px;line-height:1.4}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  cursor:pointer;color:var(--muted);font-size:14.5px;font-weight:500;margin-bottom:3px;
  transition:.15s;user-select:none;
}
.nav-item:hover{background:var(--primary-soft2);color:var(--primary)}
.nav-item.active{background:var(--primary-soft);color:var(--primary-dark);font-weight:700}
.main{flex:1;padding:26px 30px 80px;max-width:1150px;min-width:0}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px;margin-top:18px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;
  box-shadow:var(--shadow);cursor:pointer;transition:.18s;
}
.card:hover{transform:translateY(-3px);border-color:var(--primary);box-shadow:0 8px 22px rgba(74,144,217,.18)}
.card .ic{font-size:24px}
.card h3{margin:8px 0 4px;font-size:16.5px}
.card p{margin:0;color:var(--muted);font-size:13.5px}
.card .mini{margin-top:10px;font-size:12.5px;color:var(--primary-dark);font-weight:600}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat-num{font-size:21px;font-weight:700;color:var(--primary-dark)}
.stat-lbl{font-size:12.5px;color:var(--muted);margin-top:2px}

button{font-family:inherit}
.btn{
  background:var(--primary);color:#fff;border:none;border-radius:10px;padding:10px 18px;
  font-size:14.5px;font-weight:600;cursor:pointer;transition:.15s;
}
.btn:hover{background:var(--primary-dark)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.gray{background:var(--primary-soft);color:var(--primary-dark)}
.btn.gray:hover{background:var(--border)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.icon-btn{
  background:transparent;border:1px solid var(--border);border-radius:9px;width:34px;height:34px;
  cursor:pointer;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;
}
.icon-btn.on{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.icon-btn.ok-on{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}

input[type=text],select{
  font-family:inherit;font-size:14px;padding:9px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--card);color:var(--text);outline:none;
}
input[type=text]:focus,select:focus{border-color:var(--primary)}
label{font-size:14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar input[type=text]{flex:1;min-width:190px}

.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.v-card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:16px;box-shadow:var(--shadow)}
.v-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.v-word{font-size:18px;font-weight:700;color:var(--primary-dark)}
.v-ipa{font-size:13px;color:var(--muted);margin-left:7px}
.v-pos{display:inline-block;font-size:11.5px;background:var(--primary-soft);color:var(--primary-dark);
  padding:1px 8px;border-radius:20px;margin-left:7px;font-weight:600}
.v-actions{display:flex;gap:6px;flex:0 0 auto}
.v-mean{font-size:14.5px;font-weight:600;margin-top:9px}
.v-def{font-size:13.5px;color:var(--muted);margin-top:5px}
.v-ex{font-size:13.5px;font-style:italic;margin-top:7px;padding-left:10px;border-left:3px solid var(--primary-soft);color:var(--text)}
.v-tag{font-size:11.5px;color:var(--muted);margin-top:10px}

.q-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:var(--shadow);max-width:820px}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.q-text{font-size:17px;font-weight:600;margin:14px 0 18px;line-height:1.6}
.opt{
  display:flex;gap:12px;align-items:center;border:1.5px solid var(--border);border-radius:12px;
  padding:12px 15px;margin-bottom:10px;cursor:pointer;font-size:15px;background:transparent;
  width:100%;text-align:left;color:var(--text);transition:.12s;
}
.opt:hover{border-color:var(--primary);background:var(--primary-soft2)}
.opt .key{
  flex:0 0 28px;height:28px;border-radius:8px;background:var(--primary-soft);color:var(--primary-dark);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;
}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt.picked{border-color:var(--primary);background:var(--primary-soft)}
.opt.picked .key{background:var(--primary);color:#fff}
.opt.dim{opacity:.62}
.opt:disabled{cursor:default}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:14px}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok);color:var(--ok)}
.fb.no{background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad)}
.fb .exp{color:var(--text);margin-top:7px;font-size:13.5px}
.bar{height:8px;background:var(--primary-soft);border-radius:20px;overflow:hidden;margin:8px 0 0}
.bar > i{display:block;height:100%;background:var(--primary);border-radius:20px;transition:width .25s}

.fc-scene{perspective:1400px;max-width:620px;margin:0 auto}
.fc{
  position:relative;min-height:290px;border-radius:20px;cursor:pointer;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1);
}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;background:var(--card);
  border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px;text-align:center;
}
.fc-face.back{transform:rotateY(180deg);justify-content:center;gap:8px}
.fc-word{font-size:34px;font-weight:700;color:var(--primary-dark)}
.fc-ipa{font-size:16px;color:var(--muted);margin-top:8px}
.fc-pos{font-size:13px;background:var(--primary-soft);color:var(--primary-dark);padding:2px 12px;border-radius:20px;margin-top:12px;font-weight:600}
.fc-hint{position:absolute;bottom:16px;font-size:12px;color:var(--muted)}
.fc-mean{font-size:22px;font-weight:700}
.fc-def{font-size:14.5px;color:var(--muted)}
.fc-ex{font-size:14px;font-style:italic;margin-top:6px}

.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:var(--shadow);max-width:760px}
.field{margin-bottom:18px}
.field > label.title{display:block;font-weight:700;font-size:14px;margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{display:flex;align-items:center;gap:7px;border:1.5px solid var(--border);border-radius:10px;padding:8px 13px;font-size:14px;cursor:pointer}
.chip input{accent-color:var(--primary)}
.chip:hover{border-color:var(--primary)}
.navigator{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.navdot{
  width:34px;height:34px;border-radius:9px;border:1.5px solid var(--border);background:transparent;
  color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;
}
.navdot.done{background:var(--primary-soft);color:var(--primary-dark);border-color:var(--primary)}
.navdot.cur{background:var(--primary);color:#fff;border-color:var(--primary)}

.score-hero{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px;box-shadow:var(--shadow);text-align:center;max-width:760px}
.score-big{font-size:44px;font-weight:800;color:var(--primary-dark);line-height:1.1}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left}
th{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
td.num,th.num{text-align:right}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px 16px;margin-bottom:11px}
.review-item .qq{font-weight:600;font-size:14.5px}
.review-item .aa{font-size:13.5px;margin-top:7px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-right:6px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.no{background:var(--bad-bg);color:var(--bad)}
.muted{color:var(--muted);font-size:13.5px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ic{font-size:40px;display:block;margin-bottom:10px}
.pill{display:inline-block;font-size:11.5px;background:var(--primary-soft);color:var(--primary-dark);padding:2px 10px;border-radius:20px;font-weight:600}
hr{border:none;border-top:1px solid var(--border);margin:22px 0}

@media (max-width:860px){
  .layout{flex-direction:column}
  .sidebar{
    position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex:none;
    border-right:none;border-top:1px solid var(--border);padding:6px 8px;z-index:60;
  }
  .brand,.brand-sub{display:none}
  #nav{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none}
  #nav::-webkit-scrollbar{display:none}
  .nav-item{flex-direction:column;gap:2px;font-size:10px;padding:7px 11px;margin:0;white-space:nowrap;border-radius:11px}
  .nav-item span{font-size:10px}
  .main{padding:16px 14px 96px}
  h1{font-size:21px}
  .q-wrap{padding:17px}
  .q-text{font-size:15.5px}
  .fc-word{font-size:27px}
  .score-big{font-size:34px}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">📘 English Vocabulary</div>
    <div class="brand-sub">Unit 1–3 · 48 words<br>176 practice exercises</div>
    <nav id="nav">
      <div class="nav-item" data-view="dashboard">🏠<span>Dashboard</span></div>
      <div class="nav-item" data-view="vocab">📚<span>Vocabulary</span></div>
      <div class="nav-item" data-view="flashcards">🃏<span>Flashcards</span></div>
      <div class="nav-item" data-view="practice">✏️<span>Practice</span></div>
      <div class="nav-item" data-view="test">📝<span>Test</span></div>
      <div class="nav-item" data-view="progress">📊<span>Progress</span></div>
      <div class="nav-item" data-view="mistakes">❌<span>Mistakes</span></div>
      <div class="nav-item" data-view="favorites">⭐<span>Favorites</span></div>
      <div class="nav-item" data-view="settings">⚙️<span>Settings</span></div>
    </nav>
  </aside>
  <main class="main" id="view"></main>
</div>

<script>
/* =========================================================
   1. VOCABULARY DATA — 48 words (Unit 1–3, Chapter 1–2)
   ========================================================= */
const VOCAB = [
  /* ---------- UNIT 1 · CHAPTER 1 ---------- */
  {w:"academic", ipa:"/ˌækəˈdemɪk/", pos:"adj", unit:1, chapter:1,
   mean:"thuộc học thuật, mang tính học thuật",
   def:"connected with education, schools and studying",
   ex:"Regular reading can improve students' academic performance."},
  {w:"component", ipa:"/kəmˈpəʊnənt/", pos:"n", unit:1, chapter:1,
   mean:"thành phần, bộ phận cấu thành",
   def:"one of several parts that together make a whole thing",
   ex:"The course consists of several important components."},
  {w:"transfer", ipa:"/trænsˈfɜː(r)/", pos:"v", unit:1, chapter:1,
   mean:"chuyển, truyền (kiến thức, kỹ năng)",
   def:"to move something or someone from one place or situation to another",
   ex:"Knowledge transferable from one situation to another is an important learning skill."},
  {w:"long-term", ipa:"/ˌlɒŋ ˈtɜːm/", pos:"adj", unit:1, chapter:1,
   mean:"dài hạn, lâu dài",
   def:"lasting or continuing for a long period of time in the future",
   ex:"Good study habits can have long-term benefits."},
  {w:"structure", ipa:"/ˈstrʌktʃə(r)/", pos:"n", unit:1, chapter:1,
   mean:"cấu trúc, kết cấu",
   def:"the way in which the parts of something are arranged or organized",
   ex:"Students need to understand the structure of an essay."},
  {w:"effective", ipa:"/ɪˈfektɪv/", pos:"adj", unit:1, chapter:1,
   mean:"hiệu quả, có tác dụng tốt",
   def:"producing the result that is wanted or intended",
   ex:"This is an extremely effective way to learn new vocabulary."},
  {w:"technique", ipa:"/tekˈniːk/", pos:"n", unit:1, chapter:1,
   mean:"kỹ thuật, phương pháp, cách làm",
   def:"a particular way of doing something, especially one that requires skill",
   ex:"The teacher introduced a new learning technique."},
  {w:"assess", ipa:"/əˈses/", pos:"v", unit:1, chapter:1,
   mean:"đánh giá, thẩm định",
   def:"to make a judgment about the quality, size or value of something",
   ex:"Teachers use tests to assess students' progress."},

  /* ---------- UNIT 1 · CHAPTER 2 ---------- */
  {w:"reform", ipa:"/rɪˈfɔːm/", pos:"n", unit:1, chapter:2,
   mean:"sự cải cách, sự đổi mới",
   def:"a change made to a system, law or institution in order to improve it",
   ex:"Educational reform is often necessary when old methods are no longer effective."},
  {w:"measure", ipa:"/ˈmeʒə(r)/", pos:"v", unit:1, chapter:2,
   mean:"đo lường, đánh giá",
   def:"to judge the size, amount or degree of something",
   ex:"The test is designed to measure students' reading ability."},
  {w:"memorize", ipa:"/ˈmeməraɪz/", pos:"v", unit:1, chapter:2,
   mean:"ghi nhớ, học thuộc lòng",
   def:"to learn something so that you remember it exactly",
   ex:"Simply memorizing information may not lead to real understanding."},
  {w:"apply", ipa:"/əˈplaɪ/", pos:"v", unit:1, chapter:2,
   mean:"áp dụng, ứng dụng",
   def:"to use something such as knowledge or a method in a particular situation",
   ex:"Students should learn how to apply their knowledge in real-life situations."},
  {w:"alternative", ipa:"/ɔːlˈtɜːnətɪv/", pos:"n", unit:1, chapter:2,
   mean:"sự lựa chọn thay thế, phương án khác",
   def:"a thing that you can choose instead of another thing",
   ex:"Online learning provides an alternative to traditional classroom teaching."},
  {w:"debate", ipa:"/dɪˈbeɪt/", pos:"n", unit:1, chapter:2,
   mean:"cuộc tranh luận, cuộc thảo luận",
   def:"a formal discussion in which people express different opinions",
   ex:"The students had a lively debate about the best way to study."},
  {w:"unique", ipa:"/juˈniːk/", pos:"adj", unit:1, chapter:2,
   mean:"độc đáo, riêng biệt, có một không hai",
   def:"being the only one of its kind; very special",
   ex:"Vietnam has many unique cultural traditions."},
  {w:"craft", ipa:"/krɑːft/", pos:"n", unit:1, chapter:2,
   mean:"đồ thủ công; nghề thủ công",
   def:"an activity in which you make things with your hands; an object made this way",
   ex:"Traditional Vietnamese crafts are popular with foreign tourists."},

  /* ---------- UNIT 2 · CHAPTER 1 ---------- */
  {w:"accommodation", ipa:"/əˌkɒməˈdeɪʃn/", pos:"n", unit:2, chapter:1,
   mean:"chỗ ở, nơi ăn ở",
   def:"a place to live, stay or work in",
   ex:"We need to book our accommodation before travelling."},
  {w:"exhausting", ipa:"/ɪɡˈzɔːstɪŋ/", pos:"adj", unit:2, chapter:1,
   mean:"mệt mỏi, kiệt sức (làm cho ai mệt)",
   def:"making you feel very tired",
   ex:"Climbing the mountain was extremely exhausting."},
  {w:"basic", ipa:"/ˈbeɪsɪk/", pos:"adj", unit:2, chapter:1,
   mean:"cơ bản, đơn giản và cần thiết",
   def:"simple and forming the most necessary part of something",
   ex:"The hotel offers only basic facilities."},
  {w:"possession", ipa:"/pəˈzeʃn/", pos:"n", unit:2, chapter:1,
   mean:"tài sản, vật sở hữu",
   def:"something that you own or have with you",
   ex:"Tourists should protect their personal possessions."},
  {w:"fabulous", ipa:"/ˈfæbjələs/", pos:"adj", unit:2, chapter:1,
   mean:"tuyệt vời, phi thường",
   def:"extremely good or impressive",
   ex:"We had a fabulous holiday in Vũng Tàu."},
  {w:"range", ipa:"/reɪndʒ/", pos:"n", unit:2, chapter:1,
   mean:"phạm vi, loạt, nhiều loại khác nhau",
   def:"a variety of things of the same type",
   ex:"The shop offers a wide range of souvenirs."},
  {w:"eager", ipa:"/ˈiːɡə(r)/", pos:"adj", unit:2, chapter:1,
   mean:"háo hức, hăm hở, mong muốn",
   def:"wanting to do or have something very much",
   ex:"The children were eager to see the new film."},
  {w:"precaution", ipa:"/prɪˈkɔːʃn/", pos:"n", unit:2, chapter:1,
   mean:"biện pháp phòng ngừa, sự đề phòng",
   def:"something you do to prevent something bad from happening",
   ex:"Travellers should take extra precautions when carrying valuable items."},

  /* ---------- UNIT 2 · CHAPTER 2 ---------- */
  {w:"departure", ipa:"/dɪˈpɑːtʃə(r)/", pos:"n", unit:2, chapter:2,
   mean:"sự khởi hành, sự rời đi",
   def:"the act of leaving a place, especially to start a journey",
   ex:"We arrived at the airport two hours before departure."},
  {w:"expire", ipa:"/ɪkˈspaɪə(r)/", pos:"v", unit:2, chapter:2,
   mean:"hết hạn, hết hiệu lực",
   def:"to be no longer valid or able to be used",
   ex:"Check the date to make sure your passport has not expired."},
  {w:"vulnerable", ipa:"/ˈvʌlnərəbl/", pos:"adj", unit:2, chapter:2,
   mean:"dễ bị tổn thương, dễ gặp nguy hiểm",
   def:"easily harmed, attacked or affected by something",
   ex:"Children are particularly vulnerable in unfamiliar places."},
  {w:"purchase", ipa:"/ˈpɜːtʃəs/", pos:"v", unit:2, chapter:2,
   mean:"mua, tậu",
   def:"to buy something",
   ex:"Online purchasing of tickets is now very common."},
  {w:"authorized", ipa:"/ˈɔːθəraɪzd/", pos:"adj", unit:2, chapter:2,
   mean:"được ủy quyền, được cho phép chính thức",
   def:"having official permission to do something",
   ex:"Only authorized agents can sell these tickets."},
  {w:"assume", ipa:"/əˈsjuːm/", pos:"v", unit:2, chapter:2,
   mean:"giả định, cho rằng (khi chưa có bằng chứng)",
   def:"to think that something is true although you have no proof",

/* =========================================================
   3. UNIT / CHAPTER ASSIGNMENT
   ========================================================= */
function unitChapterOf(id){
  /* Part E: 20 câu trải đều 6 chương (4-3-3-3-3-4) */
  if(id>=157 && id<=176){
    if(id<=160) return [1,1];
    if(id<=163) return [1,2];
    if(id<=166) return [2,1];
    if(id<=169) return [2,2];
    if(id<=172) return [3,1];
    return [3,2];
  }
  let i;
  if(id<=42) i=Math.floor((id-1)/7);
  else if(id<=90) i=Math.floor((id-43)/8);
  else if(id<=110) i=Math.min(5,Math.floor((id-91)/3));
  else if(id<=156) i=Math.floor((id-111)/8);
  else i=0;
  return [Math.floor(i/2)+1, i%2+1];
}

   5. HELPERS
   ========================================================= */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function shuffle(a){
  const arr=a.slice();
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=arr[i]; arr[i]=arr[j]; arr[j]=t;
  }
  return arr;
}
function shuffleOptions(q){
  const idxs = q.options.map(function(_,i){return i;});
  const sh = shuffle(idxs);
  const newOpts = sh.map(function(i){ return q.options[i]; });
  const newAnswer = sh.indexOf(q.answer);
  return Object.assign({}, q, {options:newOpts, answer:newAnswer});
}
function letterOf(i){ return "ABCD"[i]; }
function pct(a,b){ return b>0 ? ((a/b)*100).toFixed(1) : "0.0"; }
function fmtTime(sec){
  sec=Math.max(0,Math.floor(sec));
  const m=Math.floor(sec/60), s=sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

/* =========================================================
   7. NAVIGATION
   ========================================================= */
document.getElementById("nav").addEventListener("click", function(e){
  const item = e.target.closest(".nav-item");
  if(!item) return;
  go(item.dataset.view);
});

function go(view){
  if(timerId){ clearInterval(timerId); timerId=null; }
  state.view = view;
  if(view!=="practice" && session && session.mode==="practice") session=null;
  if(view!=="test" && session && session.mode==="test") session=null;
  if(view==="flashcards"){ buildFlashDeck(); }
  render();
  window.scrollTo(0,0);
}

function render(){
  const el = document.getElementById("view");
  let html = "";
  switch(state.view){
    case "dashboard": html = viewDashboard(); break;
    case "vocab": html = viewVocab(); break;
    case "flashcards": html = viewFlashcards(); break;
    case "practice": html = viewPractice(); break;
    case "test": html = viewTest(); break;
    case "progress": html = viewProgress(); break;
    case "mistakes": html = viewMistakes(); break;
    case "favorites": html = viewFavorites(); break;
    case "settings": html = viewSettings(); break;
  }
  el.innerHTML = html;

  document.querySelectorAll("#nav .nav-item").forEach(function(n){
    n.classList.toggle("active", n.dataset.view === state.view);
  });

  if(state.view==="vocab"){
    const s=document.getElementById("vSearch");
    const u=document.getElementById("vUnit");
    const c=document.getElementById("vChapter");
    if(s) s.addEventListener("input", applyVocabFilter);
    if(u) u.addEventListener("change", applyVocabFilter);
    if(c) c.addEventListener("change", applyVocabFilter);
  }
  if(state.view==="flashcards"){
    const u=document.getElementById("fUnit");
    const c=document.getElementById("fChapter");
    if(u) u.addEventListener("change", function(){
      flash.weak=false;
      flashFilter.unit=u.value; flashFilter.chapter=c.value;
      buildFlashDeck(); render();
    });
    if(c) c.addEventListener("change", function(){
      flash.weak=false;
      flashFilter.unit=u.value; flashFilter.chapter=c.value;
      buildFlashDeck(); render();
    });
  }
}

function totalAttempts(){
  let t=0; for(const k in store.qStats) t += store.qStats[k].a||0; return t;
}
function totalCorrect(){
  let t=0; for(const k in store.qStats) t += store.qStats[k].c||0; return t;
}
function mistakeCount(){ return Object.keys(store.mistakes).length; }
function flashKnownCount(){
  let n=0; for(const k in store.flash){ if(store.flash[k]==="known") n++; } return n;
}
function unitVocabProgress(unit){
  const list = VOCAB.filter(function(v){ return v.unit===unit; });
  const done = list.filter(function(v){ return store.mastered.indexOf(v.w)>=0; }).length;
  return {done:done, total:list.length};
}
function unitQuestionProgress(unit){
  let att=0, cor=0, tot=0;
  QUESTIONS.forEach(function(q){
    if(q.unit!==unit) return;
    tot++;
    const st = store.qStats[q.id];
    if(st){ att += st.a||0; cor += st.c||0; }
  });
  return {attempted:att, correct:cor, total:tot};
}

function buildFlashDeck(){
  let list;
  if(flash.weak){
    list = VOCAB.filter(function(v){ return store.flash[v.w] !== "known"; });
    if(!list.length) list = VOCAB.slice();
  }else{
    list = VOCAB.filter(function(v){
      const okU = (flashFilter.unit==="all") || (String(v.unit)===flashFilter.unit);
      const okC = (flashFilter.chapter==="all") || (String(v.chapter)===flashFilter.chapter);
      return okU && okC;
    });
    if(!list.length) list = VOCAB.slice();
  }
  flash.deck = list;
  flash.idx = 0;
  flash.flipped = false;
}

function viewFlashcards(){
  if(!flash.deck.length) buildFlashDeck();
  const total = flash.deck.length;
  if(flash.idx >= total) flash.idx = total-1;
  if(flash.idx < 0) flash.idx = 0;

  let html = ''+
  '<h1>🃏 Flashcards</h1>'+
  '<p class="sub">Click vào thẻ để lật xem nghĩa · '+knownCount+' / '+total+' đã nhớ</p>'+
  '<div class="toolbar">'+
    '<select id="fUnit">'+
      '<option value="all"'+(flashFilter.unit==="all"?" selected":"")+'>All Units</option>'+
      '<option value="1"'+(flashFilter.unit==="1"?" selected":"")+'>Unit 1</option>'+
      '<option value="2"'+(flashFilter.unit==="2"?" selected":"")+'>Unit 2</option>'+
      '<option value="3"'+(flashFilter.unit==="3"?" selected":"")+'>Unit 3</option>'+
    '</select>'+
    '<select id="fChapter">'+
      '<option value="all"'+(flashFilter.chapter==="all"?" selected":"")+'>All Chapters</option>'+
      '<option value="1"'+(flashFilter.chapter==="1"?" selected":"")+'>Chapter 1</option>'+
      '<option value="2"'+(flashFilter.chapter==="2"?" selected":"")+'>Chapter 2</option>'+
    '</select>'+
    '<button class="btn gray" onclick="flashShuffle()">🔀 Shuffle</button>'+
    '<button class="btn gray" onclick="flashRestart()">↺ Restart</button>'+
    '<button class="btn ghost" onclick="flashWeak()">🔄 Review Weak Words</button>'+
  '</div>'+
  '<div class="bar" style="margin-bottom:18px"><i style="width:'+pct(knownCount,total)+'%"></i></div>'+
  '<div class="fc-scene">'+
    '<div class="fc'+(flash.flipped?" flipped":"")+'" id="fcCard" onclick="flashFlip()">'+
      '<div class="fc-face front">'+
        '<div class="fc-word">'+esc(v.w)+'</div>'+
        '<div class="fc-ipa">'+esc(v.ipa)+'</div>'+
        '<div class="fc-pos">'+esc(v.pos)+'</div>'+
        '<div class="fc-hint">Click để lật thẻ</div>'+
      '</div>'+
      '<div class="fc-face back">'+
        '<div class="fc-mean">'+esc(v.mean)+'</div>'+
        '<div class="fc-def">'+esc(v.def)+'</div>'+
        '<div class="fc-ex">“'+esc(v.ex)+'”</div>'+
        '<div class="fc-tag" style="margin-top:8px"><span class="pill">Unit '+v.unit+' · Chapter '+v.chapter+'</span></div>'+
      '</div>'+
    '</div>'+
  '</div>'+
  '<div class="btn-row" style="justify-content:center;margin-top:22px">'+
    '<button class="btn gray" onclick="flashPrev()">← Previous</button>'+
    '<button class="btn ok" onclick="flashAnswer(\'known\')">✓ I know</button>'+
    '<button class="btn bad" onclick="flashAnswer(\'unknown\')">✕ I don\'t know</button>'+
    '<button class="btn gray" onclick="flashNext()">Next →</button>'+
  '</div>'+
  '<p class="muted" style="text-align:center;margin-top:14px">Card '+(flash.idx+1)+' / '+total+' · '+pct(knownCount,total)+'% mastered</p>';
  return html;
}
function flashFlip(){
  flash.flipped = !flash.flipped;
  const el = document.getElementById("fcCard");
  if(el) el.classList.toggle("flipped", flash.flipped);
}
function flashNext(){
  if(flash.idx < flash.deck.length-1){ flash.idx++; flash.flipped=false; }
  else { flash.idx = 0; flash.flipped = false; }
  render();
}
function flashPrev(){
  if(flash.idx > 0) flash.idx--; else flash.idx = flash.deck.length-1;
  flash.flipped = false;
  render();
}
function flashShuffle(){
  flash.deck = shuffle(flash.deck);
  flash.idx = 0; flash.flipped = false;
  render();
}
function flashRestart(){
  flash.idx = 0; flash.flipped = false;
  render();
}
function flashWeak(){
  flash.weak = true;
  buildFlashDeck();
  render();
}
function flashAnswer(kind){
  const w = flash.deck[flash.idx].w;
  store.flash[w] = (kind==="known") ? "known" : "unknown";
  if(kind==="known"){
    if(store.mastered.indexOf(w)<0) store.mastered.push(w);
  }else{
    const i = store.mastered.indexOf(w);
    if(i>=0) store.mastered.splice(i,1);
  }
  store.lastStudy = nowStr();
  save();
  flashNext();
}

function labelForScope(scope){
  if(scope==="all") return "All Practice";
  if(scope==="mistakes") return "Mistakes Only";
  if(scope.indexOf("part:")===0) return "Part "+scope.split(":")[1]+" — "+PARTS[scope.split(":")[1]];
  if(scope.indexOf("unit:")===0) return "Unit "+scope.split(":")[1];
  if(scope.indexOf("chapter:")===0){ const a=scope.split(":"); return "Unit "+a[1]+" · Chapter "+a[2]; }
  return scope;
}

function startPractice(scope){
  let list = QUESTIONS.slice();
  if(scope==="mistakes"){
    list = list.filter(function(q){ return store.mistakes[q.id]; });
  }else if(scope.indexOf("part:")===0){
    const p = scope.split(":")[1];
    list = list.filter(function(q){ return q.part===p; });
  }else if(scope.indexOf("unit:")===0){
    const u = Number(scope.split(":")[1]);
    list = list.filter(function(q){ return q.unit===u; });
  }else if(scope.indexOf("chapter:")===0){
    const a = scope.split(":");
    const u = Number(a[1]), c = Number(a[2]);
    list = list.filter(function(q){ return q.unit===u && q.chapter===c; });
  }
  if(!list.length){ alert("Không có câu hỏi nào phù hợp với lựa chọn này."); return; }
  const prepared = shuffle(list).map(shuffleOptions);
  session = {
    mode:"practice", scope:scope, label:labelForScope(scope),
    list:prepared, idx:0, answers:{}, start:Date.now(), done:false
  };
  render();
  window.scrollTo(0,0);
}

function viewPractice(){
  if(!session || session.mode!=="practice") return practiceSetupHTML();
  if(session.done) return practiceResultHTML();

  const q = session.list[session.idx];
  const chosen = session.answers[q.id];
  const answered = (chosen !== undefined);
  const n = session.list.length;

  let html = ''+
  '<h1>✏️ Practice</h1>'+
  '<p class="sub">'+esc(session.label)+'</p>'+
  '<div class="q-wrap">'+
    '<div class="q-top">'+
      '<span>Question '+(session.idx+1)+' / '+n+'</span>'+
      '<span><span class="pill">Part '+q.part+' · '+PARTS[q.part]+'</span> <span class="pill">Unit '+q.unit+' · Ch '+q.chapter+'</span></span>'+
    '</div>'+
    '<div class="bar"><i style="width:'+((session.idx)/n*100).toFixed(1)+'%"></i></div>'+
    '<div class="q-text">'+esc(q.question)+'</div>';

  q.options.forEach(function(op,i){
    let cls = "opt";
    if(answered){
      if(i===q.answer) cls += " correct";
      else if(i===chosen) cls += " wrong";
      else cls += " dim";
    }
    html += '<button class="'+cls+'" '+(answered?"disabled":"")+' onclick="answerPractice('+i+')">'+
      '<span class="key">'+letterOf(i)+'</span><span>'+esc(op)+'</span></button>';
  });

  if(answered){
    if(chosen===q.answer){
      html += '<div class="fb ok">🟢 Correct!<div class="exp"><strong>Giải thích:</strong> '+esc(q.explanation)+'</div></div>';
    }else{
      html += '<div class="fb no">🔴 Incorrect<br><strong>Correct answer:</strong> '+letterOf(q.answer)+'. '+esc(q.options[q.answer])+
        '<div class="exp"><strong>Giải thích:</strong> '+esc(q.explanation)+'</div></div>';
    }
    html += '<div class="btn-row">'+
      (session.idx < n-1
        ? '<button class="btn" onclick="nextPractice()">Next Question →</button>'
        : '<button class="btn" onclick="finishPractice()">Xem kết quả 🎉</button>')+
      '<button class="btn gray" onclick="quitPractice()">Thoát</button>'+
    '</div>';
  }else{
    html += '<div class="btn-row"><button class="btn gray" onclick="quitPractice()">Thoát</button></div>';
  }

  html += '</div>';
  return html;
}

function answerPractice(i){
  if(!session || session.mode!=="practice" || session.done) return;
  const q = session.list[session.idx];
  if(session.answers[q.id] !== undefined) return;
  session.answers[q.id] = i;
  recordAnswer(q, i);
  render();
}

function nextPractice(){
  if(!session) return;
  if(session.idx < session.list.length-1){ session.idx++; render(); window.scrollTo(0,0); }
  else finishPractice();
}

function finishPractice(){
  if(!session) return;
  session.done = true;
  let cor=0, wr=0;
  session.list.forEach(function(q){
    const a = session.answers[q.id];
    if(a === undefined) return;
    if(a===q.answer) cor++; else wr++;
  });
  const unanswered = session.list.length - cor - wr;
  store.practiceHistory.unshift({
    date: nowStr(), label: session.label, total: session.list.length,
    correct: cor, wrong: wr, unanswered: unanswered,
    accuracy: pct(cor, session.list.length)
  });
  if(store.practiceHistory.length>60) store.practiceHistory.length = 60;
  store.lastStudy = nowStr();
  save();
  render();
  window.scrollTo(0,0);
}

function quitPractice(){
  session = null;
  render();
}

function recordAnswer(q, chosen){
  if(!store.qStats[q.id]) store.qStats[q.id] = {a:0, c:0};
  store.qStats[q.id].a++;
  const correct = (chosen === q.answer);
  if(correct){
    store.qStats[q.id].c++;
    if(store.mistakes[q.id]){
      store.mistakes[q.id].ok = (store.mistakes[q.id].ok||0)+1;
      if(store.mistakes[q.id].ok >= 2) delete store.mistakes[q.id];
    }
  }else{
    const m = store.mistakes[q.id] || {times:0, ok:0};
    m.times = (m.times||0)+1;
    m.ok = 0;
    m.last = nowStr();
    m.userAns = q.options[chosen];
    m.correctAns = q.options[q.answer];
    m.letter = letterOf(q.answer);
    store.mistakes[q.id] = m;
  }
  store.lastStudy = nowStr();
  save();
}

function practiceResultHTML(){
  let cor=0, wr=0;
  session.list.forEach(function(q){
    const a = session.answers[q.id];
    if(a===undefined) return;

  '<p class="sub">'+esc(session.label)+'</p>'+
  '<div class="score-hero">'+
    '<div class="score-big">'+cor+' / '+tot+'</div>'+
    '<p class="muted" style="margin-top:6px">Accuracy: '+pct(cor,tot)+'%</p>'+
    '<div class="stats-row" style="margin-top:18px">'+
      '<div class="stat"><div class="stat-num">'+cor+'</div><div class="stat-lbl">Correct</div></div>'+
      '<div class="stat"><div class="stat-num">'+wr+'</div><div class="stat-lbl">Wrong</div></div>'+
      '<div class="stat"><div class="stat-num">'+unanswered+'</div><div class="stat-lbl">Unanswered</div></div>'+
    '</div>'+
    '<div class="btn-row" style="justify-content:center">'+
      '<button class="btn" onclick="retryIncorrect()">🔁 Retry Incorrect Questions</button>'+
      '<button class="btn ghost" onclick="startPractice(\''+session.scope+'\')">↺ Retry All</button>'+
      '<button class="btn gray" onclick="go(\'dashboard\')">🏠 Dashboard</button>'+
    '</div>'+
  '</div>'+
  '<h2>Review Answers</h2>';

  session.list.forEach(function(q,i){
    const a = session.answers[q.id];
    const ok = (a===q.answer);
    html += '<div class="review-item">'+
      '<div class="qq"><span class="tag '+(ok?"ok":"no")+'">'+(ok?"Correct":"Wrong")+'</span>'+
      'Q'+q.id+'. '+esc(q.question)+'</div>'+

      (ok? "" : '<div class="aa muted">Correct answer: <strong>'+letterOf(q.answer)+'. '+esc(q.options[q.answer])+'</strong></div>')+
      '<div class="aa">💡 '+esc(q.explanation)+'</div>'+
    '</div>';
  });

  return html;
}

function retryIncorrect(){
  if(!session) return;
  const wrong = session.list.filter(function(q){
    const a = session.answers[q.id];
    return a===undefined || a!==q.answer;
  });
  if(!wrong.length){ alert("Bạn không có câu nào sai. Tuyệt vời!"); return; }
  const prepared = shuffle(wrong).map(function(q){
    return Object.assign({}, shuffleOptions(q));
  });
  session = {
    mode:"practice", scope:session.scope, label:"Retry — "+session.label,
    list:prepared, idx:0, answers:{}, start:Date.now(), done:false
  };
  render();
  window.scrollTo(0,0);
}

function startTest(){
  const countEl = document.getElementById("tCount");
  const timeEl = document.getElementById("tTime");
  const count = Number(countEl.value);
  const time = Number(timeEl.value);
  let types = [];
  document.querySelectorAll(".tType:checked").forEach(function(c){ types.push(c.value); });
  let units = [];
  document.querySelectorAll(".tUnit:checked").forEach(function(c){ units.push(Number(c.value)); });
  if(!types.length) types = ["A","B","C","D","E"];
  if(!units.length) units = [1,2,3];

  let pool = QUESTIONS.filter(function(q){
    return types.indexOf(q.part)>=0 && units.indexOf(q.unit)>=0;
  });
  if(!pool.length){ alert("Không có câu hỏi nào phù hợp."); return; }

  pool = shuffle(pool);
  const take = Math.min(count, pool.length);
  let list = pool.slice(0, take).map(shuffleOptions);

  session = {
    mode:"test",
    list:list, idx:0, answers:{}, start:Date.now(), done:false,
    timeLimit: time>0 ? time : 0,
    types: types, units: units, configCount: count
  };
  render();
  window.scrollTo(0,0);
  if(session.timeLimit>0){
    if(timerId) clearInterval(timerId);
    timerId = setInterval(tickTimer, 1000);
  }
}

function tickTimer(){
  if(!session || session.mode!=="test" || session.done){ if(timerId){clearInterval(timerId);timerId=null;} return; }
  const elapsed = Math.floor((Date.now()-session.start)/1000);
  const remain = session.timeLimit*60 - elapsed;
  const el = document.getElementById("testTimer");
  if(el) el.textContent = fmtTime(remain);
  if(remain<=0){
    if(timerId){ clearInterval(timerId); timerId=null; }
    submitTest(true);
  }
}

function viewTest(){
  if(!session || session.mode!=="test") return testSetupHTML();
  if(session.done) return testResultHTML();

  const q = session.list[session.idx];

  let html = ''+
  '<h1>📝 Test</h1>'+
  '<p class="sub">'+n+' câu · '+(session.timeLimit? ("Giới hạn "+session.timeLimit+" phút"):"Không giới hạn thời gian")+'</p>'+

      '<span>'+(session.timeLimit? ('⏱ <strong id="testTimer">'+fmtTime(session.timeLimit*60-Math.floor((Date.now()-session.start)/1000))+'</strong>') : "")+'</span>'+
    '</div>'+
    '<div class="bar"><i style="width:'+((answeredCount/n)*100).toFixed(1)+'%"></i></div>'+

  q.options.forEach(function(op,i){

      '<span class="key">'+letterOf(i)+'</span><span>'+esc(op)+'</span></button>';
  });

  html += '<div class="btn-row">'+
    '<button class="btn gray" onclick="testPrev()" '+(session.idx===0?"disabled":"")+'>← Previous</button>'+
    (session.idx < n-1
      ? '<button class="btn" onclick="testNext()">Next →</button>'
      : '<button class="btn ok" onclick="submitTest(false)">✅ Submit Test</button>')+
    '<button class="btn ghost" onclick="submitTest(false)">Submit ngay</button>'+
    '<button class="btn gray" onclick="quitTest()">Thoát</button>'+
  '</div>';

  html += '<div class="navigator">';
  session.list.forEach(function(x,i){
    const done = session.answers[x.id]!==undefined;
    const cur = (i===session.idx);
    html += '<button class="navdot '+(cur?"cur":(done?"done":""))+'" onclick="testGoto('+i+')">'+(i+1)+'</button>';
  });
  html += '</div>';

  html += '</div>';
  return html;
}

function answerTest(i){
  if(!session || session.done) return;
  session.answers[session.list[session.idx].id] = i;
  render();
}
function testNext(){
  if(session.idx < session.list.length-1){ session.idx++; render(); window.scrollTo(0,0); }
}
function testPrev(){
  if(session.idx > 0){ session.idx--; render(); window.scrollTo(0,0); }
}
function testGoto(i){
  session.idx = i; render(); window.scrollTo(0,0);
}
function quitTest(){
  if(timerId){ clearInterval(timerId); timerId=null; }
  session = null;
  render();
}

function submitTest(auto){
  if(!session || session.done) return;
  if(!auto){
    const answered = Object.keys(session.answers).length;
    if(answered < session.list.length){
      if(!confirm("Bạn còn "+(session.list.length-answered)+" câu chưa trả lời. Vẫn nộp bài?")) return;
    }
  }
  if(timerId){ clearInterval(timerId); timerId=null; }
  session.done = true;
  session.endTime = Date.now();

  let cor=0, wr=0, un=0;
  const byPart = {};
  session.list.forEach(function(q){
    const a = session.answers[q.id];
    if(!byPart[q.part]) byPart[q.part] = {c:0, t:0};
    byPart[q.part].t++;
    if(a===undefined){ un++; }
    else if(a===q.answer){ cor++; byPart[q.part].c++; }
    else { wr++; }
    if(!store.qStats[q.id]) store.qStats[q.id] = {a:0,c:0};
    store.qStats[q.id].a++;
    if(a!==undefined && a===q.answer){
      store.qStats[q.id].c++;
      if(store.mistakes[q.id]){
        store.mistakes[q.id].ok = (store.mistakes[q.id].ok||0)+1;
        if(store.mistakes[q.id].ok>=2) delete store.mistakes[q.id];
      }
    }else if(a!==undefined){
      const m = store.mistakes[q.id] || {times:0, ok:0};
      m.times = (m.times||0)+1;
      m.ok = 0;
      m.last = nowStr();
      m.userAns = q.options[a];
      m.correctAns = q.options[q.answer];
      m.letter = letterOf(q.answer);
      store.mistakes[q.id] = m;
    }
  });

  const total = session.list.length;
  const timeUsed = Math.floor((session.endTime - session.start)/1000);
  const record = {
    date: nowStr(),
    total: total, correct: cor, wrong: wr, unanswered: un,
    percentage: pct(cor, total),
    timeUsed: timeUsed,
    timeLimit: session.timeLimit,
    types: session.types.join(", "),
    units: session.units.join(", "),
    byPart: JSON.parse(JSON.stringify(byPart))
  };
  store.testHistory.unshift(record);
  if(store.testHistory.length>40) store.testHistory.length = 40;
  store.lastStudy = nowStr();
  save();
  render();
  window.scrollTo(0,0);
}

    '</div>'+

      '<button class="btn ghost" onclick="retryTestWrong()">🔁 Retry Wrong Questions</button>'+
      '<button class="btn gray" onclick="quitTest()">↩ New Test</button>'+
      '<button class="btn gray" onclick="go(\'dashboard\')">🏠 Dashboard</button>'+
    '</div>'+
  '</div>'+
  '<h2>By Question Type</h2>'+
  '<table><thead><tr><th>Type</th><th class="num">Correct</th><th class="num">Total</th><th class="num">Accuracy</th></tr></thead><tbody>';

  ["A","B","C","D","E"].forEach(function(p){
    if(!byPart[p]) return;
    html += '<tr><td>'+PARTS[p]+'</td><td class="num">'+byPart[p].c+'</td><td class="num">'+byPart[p].t+'</td><td class="num">'+pct(byPart[p].c, byPart[p].t)+'%</td></tr>';
  });
  html += '</tbody></table><div id="testReview"></div>';

function reviewTestAnswers(){
  const el = document.getElementById("testReview");
  if(!el) return;
  if(el.dataset.open==="1"){ el.innerHTML=""; el.dataset.open="0"; return; }
  let html = '<h2>Chi tiết đáp án</h2>';
  session.list.forEach(function(q){
    const a = session.answers[q.id];
    const ok = (a===q.answer);
    html += '<div class="review-item">'+
      '<div class="qq"><span class="tag '+(ok?"ok":"no")+'">'+(ok?"Correct":(a===undefined?"Skipped":"Wrong"))+'</span>'+
      'Q'+q.id+'. '+esc(q.question)+'</div>'+
      '<div class="aa muted">Your answer: <strong>'+(a===undefined?"—":letterOf(a)+". "+esc(q.options[a]))+'</strong></div>'+
      (ok?"":'<div class="aa muted">Correct answer: <strong>'+letterOf(q.answer)+'. '+esc(q.options[q.answer])+'</strong></div>')+
      '<div class="aa">💡 '+esc(q.explanation)+'</div>'+
    '</div>';
  });
  el.innerHTML = html;
  el.dataset.open = "1";
}

function retryTestWrong(){
  if(timerId){ clearInterval(timerId); timerId=null; }
  const wrong = session.list.filter(function(q){
    const a = session.answers[q.id];
    return a===undefined || a!==q.answer;
  });
  if(!wrong.length){ alert("Không có câu sai để làm lại. Xuất sắc!"); return; }
  const prepared = shuffle(wrong).map(shuffleOptions);
  session = {
    mode:"practice", scope:"all", label:"Retry Wrong (Test)",
    list:prepared, idx:0, answers:{}, start:Date.now(), done:false
  };
  state.view = "practice";
  render();
  window.scrollTo(0,0);
}

   15. PROGRESS VIEW
   ========================================================= */
function viewProgress(){
  const mastered = store.mastered.length;
  const att = totalAttempts(), cor = totalCorrect();

  let html = ''+
  '<h1>📊 My Progress</h1>'+
  '<p class="sub">Tiến độ học tập được lưu tự động trên trình duyệt này</p>'+

  '<h2>Vocabulary</h2>'+
  '<div class="panel">'+
    '<div class="muted">'+mastered+' / 48 mastered · '+flashKnownCount()+' flashcards known</div>'+
    '<div class="bar" style="margin-top:10px"><i style="width:'+pct(mastered,48)+'%"></i></div>'+
    '<p class="muted" style="margin-top:8px">'+pct(mastered,48)+'% hoàn thành</p>'+
  '</div>'+

  '<h2>Practice</h2>'+
  '<div class="stats-row">'+
    '<div class="stat"><div class="stat-num">'+att+'</div><div class="stat-lbl">Total attempts</div></div>'+
    '<div class="stat"><div class="stat-num">'+cor+'</div><div class="stat-lbl">Correct</div></div>'+
    '<div class="stat"><div class="stat-num">'+(att-cor)+'</div><div class="stat-lbl">Wrong</div></div>'+
    '<div class="stat"><div class="stat-num">'+pct(cor,att)+'%</div><div class="stat-lbl">Accuracy</div></div>'+
  '</div>'+

  '<h2>Unit Progress</h2>'+
  '<table><thead><tr><th>Unit</th><th class="num">Vocabulary</th><th class="num">Practice accuracy</th></tr></thead><tbody>';
  [1,2,3].forEach(function(u){
    const v = unitVocabProgress(u);
    const p = unitQuestionProgress(u);
    html += '<tr><td>Unit '+u+'</td><td class="num">'+pct(v.done,v.total)+'% ('+v.done+'/'+v.total+')</td>'+
      '<td class="num">'+pct(p.correct, p.attempted)+'%</td></tr>';
  });
  html += '</tbody></table>';

  html += '<h2>Test</h2>';
  if(!store.testHistory.length){
    html += '<div class="empty"><span class="ic">📝</span>Bạn chưa làm bài test nào.</div>';
  }else{
    const scores = store.testHistory.map(function(t){ return Number(t.percentage); });
    const best = Math.max.apply(null, scores);
    const avg = (scores.reduce(function(a,b){return a+b;},0)/scores.length).toFixed(1);
    html += '<div class="stats-row">'+
      '<div class="stat"><div class="stat-num">'+store.testHistory.length+'</div><div class="stat-lbl">Tests taken</div></div>'+
      '<div class="stat"><div class="stat-num">'+best+'%</div><div class="stat-lbl">Highest score</div></div>'+
      '<div class="stat"><div class="stat-num">'+avg+'%</div><div class="stat-lbl">Average score</div></div>'+
    '</div>';
    html += '<table><thead><tr><th>Date</th><th class="num">Score</th><th class="num">%</th><th class="num">Time</th></tr></thead><tbody>';
    store.testHistory.slice(0,10).forEach(function(t){
      html += '<tr><td>'+esc(t.date)+'</td><td class="num">'+t.correct+'/'+t.total+'</td><td class="num">'+t.percentage+'%</td><td class="num">'+fmtTime(t.timeUsed)+'</td></tr>';
    });
    html += '</tbody></table>';
  }

  html += '<h2>Practice History</h2>';
  if(!store.practiceHistory.length){
    html += '<div class="empty"><span class="ic">✏️</span>Chưa có lịch sử luyện tập.</div>';
  }else{
    html += '<table><thead><tr><th>Date</th><th>Scope</th><th class="num">Correct</th><th class="num">Total</th><th class="num">Accuracy</th></tr></thead><tbody>';
    store.practiceHistory.slice(0,10).forEach(function(h){
      html += '<tr><td>'+esc(h.date)+'</td><td>'+esc(h.label)+'</td><td class="num">'+h.correct+'</td><td class="num">'+h.total+'</td><td class="num">'+h.accuracy+'%</td></tr>';
    });
    html += '</tbody></table>';
  }

  if(store.lastStudy){
    html += '<p class="muted" style="margin-top:24px">🕒 Lần học gần nhất: '+esc(store.lastStudy)+'</p>';
  }
  return html;
}

function setTheme(t){
  store.theme = t;
  save();
  document.documentElement.setAttribute("data-theme", t==="dark"?"dark":"light");
  render();
}
function confirmReset(){
  if(confirm("Are you sure you want to reset all progress?\n\n(Toàn bộ tiến độ học tập sẽ bị xoá. Ngân hàng câu hỏi vẫn được giữ nguyên.)")){
    const theme = store.theme;
    store = defaultStore();
    store.theme = theme;
    save();
    session = null;
    alert("Đã reset toàn bộ tiến độ học tập.");
    go("dashboard");
  }
}
