<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary & Verb Forms Trainer — Units 1–6 | B1–B2</title>
<style>
:root{
  --bg:#f0f6fc; --card:#ffffff; --text:#2c3e50; --muted:#7f8c9a;
  --primary:#5b9bd5; --primary-dark:#3d7ab8; --primary-light:#e8f2fb;
  --border:#d9e6f2; --ok:#27ae60; --ok-bg:#e8f8f0;
  --bad:#e74c3c; --bad-bg:#fdeaea; --warn:#e6a23c; --warn-bg:#fdf6ec;
  --shadow:0 2px 10px rgba(91,155,213,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6; font-size:15px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{cursor:not-allowed;opacity:.55}
input,select{font-family:inherit}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{
  width:230px;flex:0 0 230px;background:var(--card);border-right:1px solid var(--border);
  padding:20px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.logo{font-weight:700;font-size:16px;color:var(--primary-dark);margin-bottom:4px}
.logo-sub{font-size:11.5px;color:var(--muted);margin-bottom:22px;line-height:1.4}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  font-size:14px;font-weight:500;color:var(--muted);margin-bottom:3px;
  transition:.15s;width:100%;text-align:left;
}
.nav-item:hover{background:var(--primary-light);color:var(--primary-dark)}
.nav-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:700}
.nav-item .ico{font-size:16px;width:20px;text-align:center}
.main{flex:1;padding:28px 32px 100px;max-width:1080px;min-width:0}

/* Typography */
h1{font-size:24px;margin-bottom:6px;color:var(--text)}
h2{font-size:18px;margin:26px 0 12px;color:var(--text)}
h3{font-size:15.5px;margin-bottom:8px}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:20px}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  background:var(--primary);color:#fff;border-radius:10px;padding:10px 18px;
  font-size:14px;font-weight:600;transition:.15s;
}
.btn:hover:not(:disabled){background:var(--primary-dark)}
.btn.ghost{background:transparent;color:var(--primary-dark);border:1.5px solid var(--primary)}
.btn.ghost:hover:not(:disabled){background:var(--primary-light)}
.btn.gray{background:var(--primary-light);color:var(--primary-dark)}
.btn.gray:hover:not(:disabled){background:var(--border)}
.btn.ok{background:var(--ok)}
.btn.ok:hover:not(:disabled){background:#1e8449}
.btn.bad{background:var(--bad)}
.btn.bad:hover:not(:disabled){background:#c0392b}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* Cards */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:18px;box-shadow:var(--shadow);transition:.18s;
}
.card.clickable{cursor:pointer}
.card.clickable:hover{transform:translateY(-2px);border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:16px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.stat-num{font-size:20px;font-weight:700;color:var(--primary-dark)}
.stat-lbl{font-size:12.5px;color:var(--muted);margin-top:2px}

/* Progress bar */
.bar{height:8px;background:var(--primary-light);border-radius:20px;overflow:hidden;margin:10px 0}
.bar > i{display:block;height:100%;background:var(--primary);border-radius:20px;transition:width .3s}

/* Question */
.q-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:var(--shadow);max-width:840px}
.q-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.q-text{font-size:17px;font-weight:600;margin:16px 0 18px;line-height:1.6}
.pill{display:inline-block;font-size:11.5px;background:var(--primary-light);color:var(--primary-dark);padding:2px 9px;border-radius:20px;font-weight:600;margin-right:5px}
.opt{
  display:flex;gap:12px;align-items:center;border:1.5px solid var(--border);border-radius:11px;
  padding:12px 15px;margin-bottom:10px;font-size:15px;background:transparent;
  width:100%;text-align:left;color:var(--text);transition:.12s;
}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-light)}
.opt .key{
  flex:0 0 26px;height:26px;border-radius:7px;background:var(--primary-light);color:var(--primary-dark);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;
}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt.selected{border-color:var(--primary);background:var(--primary-light)}
.opt.selected .key{background:var(--primary);color:#fff}

.fb{margin-top:14px;border-radius:11px;padding:13px 15px;font-size:14px}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok);color:#1e7a45}
.fb.no{background:var(--bad-bg);border:1px solid var(--bad);color:#b03a2e}
.fb .exp{color:var(--text);margin-top:6px;font-size:13.5px;line-height:1.6}

/* Navigator */
.nav-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:18px}
.nav-dot{
  width:32px;height:32px;border-radius:8px;border:1.5px solid var(--border);
  background:transparent;color:var(--muted);font-size:12px;font-weight:600;transition:.12s;
}
.nav-dot:hover{border-color:var(--primary)}
.nav-dot.current{background:var(--primary);color:#fff;border-color:var(--primary)}
.nav-dot.done{background:var(--primary-light);color:var(--primary-dark);border-color:var(--primary)}
.nav-dot.correct{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.nav-dot.wrong{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}

/* Flashcard */
.fc-scene{perspective:1200px;max-width:620px;margin:0 auto}
.fc{
  position:relative;min-height:280px;border-radius:18px;cursor:pointer;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1);
}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;background:var(--card);
  border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px;text-align:center;gap:8px;
}
.fc-face.back{transform:rotateY(180deg)}
.fc-word{font-size:32px;font-weight:700;color:var(--primary-dark)}
.fc-pos{font-size:13px;color:var(--muted);font-weight:600}
.fc-ipa{font-size:15px;color:var(--muted)}
.fc-mean{font-size:20px;font-weight:700}
.fc-ex{font-size:13.5px;font-style:italic;color:var(--muted);max-width:90%}
.fc-hint{position:absolute;bottom:14px;font-size:11.5px;color:var(--muted)}

/* Vocabulary */
.v-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.v-item{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;
}
.v-item:hover{border-color:var(--primary)}
.v-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.v-word{font-size:16px;font-weight:700;color:var(--primary-dark)}
.v-pos{font-size:12px;color:var(--muted);font-weight:600}
.v-ipa{font-size:12.5px;color:var(--muted)}
.v-mean{font-size:14px;margin-top:6px;font-weight:600}
.v-detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:13.5px;color:var(--text)}
.v-detail .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-bottom:2px}
.v-unit{display:inline-block;font-size:11px;background:var(--primary-light);color:var(--primary-dark);padding:1px 8px;border-radius:20px;margin-top:8px;font-weight:600}

/* Test result table */
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:12px}
th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
td.center,th.center{text-align:center}

/* Score hero */
.score-hero{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px;box-shadow:var(--shadow);text-align:center;max-width:760px}
.score-big{font-size:42px;font-weight:800;color:var(--primary-dark);line-height:1.1}
.score-sub{color:var(--muted);font-size:14px;margin-top:6px}

/* Empty state */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ic{font-size:42px;display:block;margin-bottom:10px}

/* Toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar select,.toolbar input{
  padding:9px 12px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--card);font-size:14px;color:var(--text);outline:none;
}
.toolbar input{flex:1;min-width:180px}
.toolbar select:focus,.toolbar input:focus{border-color:var(--primary)}

/* Review item */
.review-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.review-item .rq{font-weight:600;font-size:14.5px}
.review-item .ra{font-size:13.5px;margin-top:6px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-right:6px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.no{background:var(--bad-bg);color:var(--bad)}

/* Mobile */
.bottom-nav{display:none}
@media (max-width: 860px){
  .app{flex-direction:column}
  .sidebar{display:none}
  .main{padding:18px 14px 92px}
  h1{font-size:20px}
  .q-box{padding:18px}
  .q-text{font-size:15.5px}
  .fc-word{font-size:26px}
  .score-big{font-size:34px}
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);
    border-top:1px solid var(--border);z-index:100;padding:5px 4px;
    overflow-x:auto;gap:2px;box-shadow:0 -2px 10px rgba(0,0,0,.05);
  }
  .bottom-nav::-webkit-scrollbar{display:none}
  .bn-item{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;
    padding:7px 11px;font-size:10px;color:var(--muted);border-radius:9px;white-space:nowrap;
  }
  .bn-item .ico{font-size:16px}
  .bn-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:700}
}
@media (max-width: 480px){
  .grid{grid-template-columns:1fr}
  .v-list{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">Vocabulary Trainer</div>
    <div class="logo-sub">Units 1–6 · B1–B2<br>176 Questions</div>
    <nav id="navDesktop"></nav>
  </aside>

  <main class="main" id="main"></main>

  <nav class="bottom-nav" id="navMobile"></nav>
</div>

function todayStr(){
  const d=new Date();
  const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  return months[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
}
function nowStr(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

   4. HELPERS
   ========================================================== */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function shuffle(a){
  const arr=a.slice();
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=arr[i]; arr[i]=arr[j]; arr[j]=t;
  }
  return arr;
}
function letterOf(i){ return "ABCD"[i]; }
function pct(a,b){ return b>0 ? ((a/b)*100).toFixed(1) : "0.0"; }
function prepareQuestion(q){
  const idx = q.options.map(function(_,i){return i;});
  const sh = shuffle(idx);
  const newOptions = sh.map(function(i){ return q.options[i]; });
  const newAnswer = sh.indexOf(q.answer);
  return {
    id:q.id, part:q.part, question:q.question,
    options:newOptions, answer:newAnswer,
    explanation:q.explanation,
    originalOptions:q.options,
    originalAnswer:q.answer
  };
}

  renderNav();

  switch(state.view){
    case "home": main.innerHTML = viewHome(); break;

    case "vocabulary": main.innerHTML = viewVocabulary(); break;
    case "practice": main.innerHTML = viewPractice(); break;
    case "test": main.innerHTML = viewTest(); break;
    case "progress": main.innerHTML = viewProgress(); break;
    case "mistakes": main.innerHTML = viewMistakes(); break;
  }
  afterRender();
}
function afterRender(){
  if(state.view==="vocabulary"){

    if(u) u.addEventListener("change", filterVocab);

  if(state.view==="flashcards"){
    const u=document.getElementById("fcUnit");
    if(u) u.addEventListener("change", function(){ fc.unit=u.value; buildFlashDeck(); render(); });
  }
}

function buildFlashDeck(){
  let list = VOCAB.slice();
  if(fc.unit!=="all") list = list.filter(function(v){ return v.unit===Number(fc.unit); });
  fc.deck = list;
  fc.idx = 0;
  fc.flipped = false;
}
function viewFlashcards(){
  if(!fc.deck.length) buildFlashDeck();
  const total = fc.deck.length;
  if(fc.idx>=total) fc.idx = total-1;
  if(fc.idx<0) fc.idx = 0;
  const v = fc.deck[fc.idx];
  const known = fc.deck.filter(function(x){ return store.flashcards[x.w]==="known"; }).length;
  const review = fc.deck.filter(function(x){ return store.flashcards[x.w]==="review"; }).length;

  return ''+
  '<h1>📚 Flashcards</h1>'+
  '<p class="sub">'+total+' cards · '+known+' known · '+review+' to review</p>'+
  '<div class="toolbar">'+
    '<select id="fcUnit">'+
      '<option value="all"'+(fc.unit==="all"?" selected":"")+'>All Units</option>'+
      [1,2,3,4,5,6].map(function(u){ return '<option value="'+u+'"'+(fc.unit==String(u)?" selected":"")+'>Unit '+u+'</option>'; }).join("")+
    '</select>'+
    '<button class="btn gray" onclick="fcShuffle()">🔀 Shuffle</button>'+
    '<button class="btn gray" onclick="fcRestart()">↺ Restart</button>'+
    '<button class="btn ghost" onclick="fcReviewWeak()">🔄 Review Weak Cards</button>'+
  '</div>'+
  '<div class="bar"><i style="width:'+pct(known,total)+'%"></i></div>'+
  '<p class="sub" style="text-align:right;margin-top:-4px">'+pct(known,total)+'% known</p>'+
  '<div class="fc-scene">'+
    '<div class="fc'+(fc.flipped?" flipped":"")+'" id="fcCard" onclick="fcFlip()">'+
      '<div class="fc-face">'+
        '<div class="fc-word">'+esc(v.w)+'</div>'+
        '<div class="fc-pos">'+esc(v.pos)+'</div>'+
        '<div class="fc-ipa">'+esc(v.ipa)+'</div>'+
        '<div class="fc-hint">Click to flip</div>'+
      '</div>'+
      '<div class="fc-face back">'+
        '<div class="fc-mean">'+esc(v.mean)+'</div>'+
        '<div class="fc-ex">“'+esc(v.ex)+'”</div>'+
        '<div style="margin-top:6px"><span class="pill">Unit '+v.unit+'</span></div>'+
      '</div>'+
    '</div>'+
  '</div>'+
  '<div class="btn-row" style="justify-content:center;margin-top:24px">'+
    '<button class="btn gray" onclick="fcPrev()">← Previous</button>'+
    '<button class="btn ok" onclick="fcMark(\'known\')">✓ Known</button>'+
    '<button class="btn bad" onclick="fcMark(\'review\')">✕ Review</button>'+
    '<button class="btn gray" onclick="fcNext()">Next →</button>'+
  '</div>'+
  '<p class="sub" style="text-align:center;margin-top:14px">Card '+(fc.idx+1)+' / '+total+'</p>';
}
function fcFlip(){
  fc.flipped = !fc.flipped;
  const el = document.getElementById("fcCard");
  if(el) el.classList.toggle("flipped", fc.flipped);
}
function fcNext(){
  if(fc.idx<fc.deck.length-1) fc.idx++; else fc.idx=0;
  fc.flipped=false; render();
}
function fcPrev(){
  if(fc.idx>0) fc.idx--; else fc.idx=fc.deck.length-1;
  fc.flipped=false; render();
}
function fcShuffle(){
  fc.deck = shuffle(fc.deck); fc.idx=0; fc.flipped=false; render();
}
function fcRestart(){
  fc.idx=0; fc.flipped=false; render();
}
function fcMark(kind){
  const w = fc.deck[fc.idx].w;
  store.flashcards[w] = kind;
  store.lastStudy = nowStr();
  save();
  fcNext();
}
function fcReviewWeak(){
  const weak = VOCAB.filter(function(v){ return store.flashcards[v.w]!=="known"; });
  fc.deck = weak.length ? weak : VOCAB.slice();
  fc.idx=0; fc.flipped=false;
  render();
}

function startPractice(scope){
  let list = QUESTIONS.slice();
  if(scope==="mistakes"){
    const ids = Object.keys(store.mistakes).map(Number);
    list = list.filter(function(q){ return ids.indexOf(q.id)>=0; });
  }else if(scope!=="all"){
    list = list.filter(function(q){ return q.part===scope; });
  }
  if(!list.length){ alert("No questions match this selection."); return; }
  practice = {
    scope: scope,
    questions: shuffle(list).map(prepareQuestion),
    index: 0,
    answers: {},
    finished: false,
    startTime: Date.now()
  };
  render();
  window.scrollTo(0,0);
}

function practiceSession(){
  const q = practice.questions[practice.index];
  const chosen = practice.answers[q.id];
  const answered = chosen !== undefined;
  const n = practice.questions.length;

  let html = ''+
  '<h1>📝 Practice</h1>'+
  '<p class="sub">'+labelForScope(practice.scope)+' · Question '+(practice.index+1)+' / '+n+'</p>'+

    '<div class="q-text">'+esc(q.question)+'</div>';

  q.options.forEach(function(op,i){
    let cls = "opt";
    if(answered){
      if(i===q.answer) cls += " correct";
      else if(i===chosen) cls += " wrong";
      else cls += "";
    }
    html += '<button class="'+cls+'" '+(answered?"disabled":"")+' onclick="answerPractice('+i+')">'+
      '<span class="key">'+letterOf(i)+'</span><span>'+esc(op)+'</span></button>';
  });

  if(answered){
    if(chosen===q.answer){
      html += '<div class="fb ok">🟢 Correct!<div class="exp">'+q.explanation+'</div></div>';
    }else{
      html += '<div class="fb no">🔴 Incorrect — Correct answer: <strong>'+letterOf(q.answer)+'. '+esc(q.options[q.answer])+'</strong>'+
        '<div class="exp">'+q.explanation+'</div></div>';

function answerPractice(i){

function retryIncorrect(){
  if(!practice) return;
  const wrong = practice.questions.filter(function(q){
    const a = practice.answers[q.id];
    return a===undefined || a!==q.answer;
  });
  if(!wrong.length){ alert("No incorrect questions to retry. Excellent!"); return; }

    scope: practice.scope,
    questions: shuffle(wrong).map(prepareQuestion),
    index:0, answers:{}, finished:false, startTime:Date.now()
  };
  render(); window.scrollTo(0,0);
}

function labelForScope(scope){
  if(scope==="all") return "All Questions (176)";
  if(scope==="mistakes") return "Mistakes Only";
  const names = {A:"Part A — Word Form",B:"Part B — Vocabulary in Context",C:"Part C — Mixed Vocabulary",D:"Part D — Verb Forms",E:"Part E — Mixed Verb Forms"};
  return names[scope]||scope;
}

function recordAnswer(q, chosen){
  if(!store.questionStats[q.id]) store.questionStats[q.id] = {attempts:0, correct:0, lastResult:null};
  store.questionStats[q.id].attempts++;
  const isCorrect = (chosen === q.answer);
  if(isCorrect){
    store.questionStats[q.id].correct++;
    store.questionStats[q.id].lastResult = "correct";
    if(store.mistakes[q.id]){
      store.mistakes[q.id].mastered = true;
    }
  }else{
    store.questionStats[q.id].lastResult = "incorrect";
    const m = store.mistakes[q.id] || {timesWrong:0, mastered:false};
    m.timesWrong = (m.timesWrong||0)+1;
    m.userAnswer = q.options[chosen];
    m.correctAnswer = q.options[q.answer];
    m.correctLetter = letterOf(q.answer);
    m.lastDate = nowStr();
    m.mastered = false;
    store.mistakes[q.id] = m;
  }
  store.lastStudy = nowStr();
  save();
}

function testGoto(i){ test.index = i; render(); window.scrollTo(0,0); }
function quitTest(){ test = null; render(); }

function submitTest(){
  if(!test || test.finished) return;
  const unanswered = test.questions.length - Object.keys(test.answers).length;
  if(unanswered > 0){
    if(!confirm("You still have "+unanswered+" unanswered question(s). Submit anyway?")) return;
  }
  test.finished = true;
  test.endTime = Date.now();

  let correct=0, wrong=0, skipped=0;
  const byPart = {};
  test.questions.forEach(function(q){
    const a = test.answers[q.id];
    if(!byPart[q.part]) byPart[q.part] = {correct:0, total:0};
    byPart[q.part].total++;
    if(a===undefined) skipped++;
    else if(a===q.answer){ correct++; byPart[q.part].correct++; }
    else wrong++;
    // record in store
    if(!store.questionStats[q.id]) store.questionStats[q.id] = {attempts:0, correct:0, lastResult:null};
    store.questionStats[q.id].attempts++;
    if(a!==undefined && a===q.answer){
      store.questionStats[q.id].correct++;
      store.questionStats[q.id].lastResult = "correct";
      if(store.mistakes[q.id]) store.mistakes[q.id].mastered = true;
    }else if(a!==undefined){
      store.questionStats[q.id].lastResult = "incorrect";
      const m = store.mistakes[q.id] || {timesWrong:0, mastered:false};
      m.timesWrong = (m.timesWrong||0)+1;
      m.userAnswer = q.options[a];
      m.correctAnswer = q.options[q.answer];
      m.correctLetter = letterOf(q.answer);
      m.lastDate = nowStr();
      m.mastered = false;
      store.mistakes[q.id] = m;
    }
  });

  const total = test.questions.length;
  store.testHistory.unshift({
    date: todayStr(),
    scope: test.scope,
    total: total,
    correct: correct,
    wrong: wrong,
    skipped: skipped,
    percentage: pct(correct,total),
    byPart: JSON.parse(JSON.stringify(byPart))
  });
  if(store.testHistory.length>50) store.testHistory.length = 50;
  store.testCount = (store.testCount||0)+1;
  store.lastStudy = nowStr();
  save();
  render();
  window.scrollTo(0,0);
}

    '<div class="stat"><div class="stat-num">'+totalCorrect+'</div><div class="stat-lbl">Total correct answers</div></div>'+
    '<div class="stat"><div class="stat-num">'+totalWrong+'</div><div class="stat-lbl">Total incorrect answers</div></div>'+
    '<div class="stat"><div class="stat-num">'+pct(totalCorrect,totalAttempts)+'%</div><div class="stat-lbl">Accuracy</div></div>'+
  '</div>'+
  '<div class="bar"><i style="width:'+pct(attempted,total)+'%"></i></div>'+
  '<p class="sub" style="margin-top:4px">'+pct(attempted,total)+'% of the question bank attempted</p>'+

  '<h2>Flashcards</h2>'+
  '<div class="stat-grid">'+
    '<div class="stat"><div class="stat-num">'+flashKnown+' / '+VOCAB.length+'</div><div class="stat-lbl">Known</div></div>'+
    '<div class="stat"><div class="stat-num">'+flashReview+'</div><div class="stat-lbl">To review</div></div>'+
    '<div class="stat"><div class="stat-num">'+(VOCAB.length-flashKnown-flashReview)+'</div><div class="stat-lbl">Not studied</div></div>'+
  '</div>'+
  '<div class="bar"><i style="width:'+pct(flashKnown,VOCAB.length)+'%"></i></div>'+

  '<h2>Mistakes</h2>'+
  '<div class="stat-grid">'+
    '<div class="stat"><div class="stat-num">'+Object.keys(store.mistakes).length+'</div><div class="stat-lbl">Questions to review</div></div>'+
    '<div class="stat"><div class="stat-num">'+masteredMistakes+'</div><div class="stat-lbl">Mastered after retry</div></div>'+
  '</div>'+

  '<h2>Test History</h2>';
  if(!store.testHistory.length){
    html += '<div class="empty"><span class="ic">🧪</span>No tests taken yet.</div>';
  }else{
    html += '<table><thead><tr><th>Date</th><th>Scope</th><th class="center">Questions</th><th class="center">Score</th><th class="center">Accuracy</th></tr></thead><tbody>';
    store.testHistory.slice(0,15).forEach(function(t){
      html += '<tr><td>'+esc(t.date)+'</td><td>'+esc(t.scope)+'</td><td class="center">'+t.total+'</td><td class="center">'+t.correct+'/'+t.total+'</td><td class="center">'+t.percentage+'%</td></tr>';
    });
    html += '</tbody></table>';
  }

  html += '<h2>Session Counts</h2>'+
  '<div class="stat-grid">'+
    '<div class="stat"><div class="stat-num">'+(store.practiceCount||0)+'</div><div class="stat-lbl">Practice sessions</div></div>'+
    '<div class="stat"><div class="stat-num">'+(store.testCount||0)+'</div><div class="stat-lbl">Test sessions</div></div>'+
  '</div>';

  if(store.lastStudy){
    html += '<p class="sub" style="margin-top:20px">🕒 Last activity: '+esc(store.lastStudy)+'</p>';
  }

  html += '<h2>Danger Zone</h2>'+
  '<div class="card" style="border-color:var(--bad)">'+
    '<p style="font-size:13.5px;color:var(--muted);margin-bottom:12px">This will erase all progress: question statistics, mistakes, flashcard progress and test history. The question bank stays intact.</p>'+
    '<button class="btn bad" onclick="resetProgress()">🗑 Reset Progress</button>'+
  '</div>';

  return html;
}

function resetProgress(){
  if(!confirm("Are you sure you want to reset all progress?")) return;
  store = defaultStore();
  save();
  practice = null; test = null;
  alert("All progress has been reset.");
  go("home");
}

/* ==========================================================
   14. MISTAKES
   ========================================================== */
function viewMistakes(){
  const ids = Object.keys(store.mistakes).map(Number).sort(function(a,b){ return a-b; });
  let html = '<h1>❌ Mistakes Review</h1>'+
  '<p class="sub">Questions you answered incorrectly. Retry them to mark as mastered.</p>';

  if(!ids.length){
    html += '<div class="empty"><span class="ic">🎯</span>No mistakes yet. Practice more to see your weak spots!</div>';
    return html;
  }

  html += '<div class="btn-row" style="margin-bottom:18px">'+
    '<button class="btn bad" onclick="startPractice(\'mistakes\')">▶ Practice Mistakes ('+ids.length+')</button>'+
  '</div>';

  ids.forEach(function(id){
    const q = getQ(id);
    if(!q) return;
    const m = store.mistakes[id];
    html += '<div class="review-item">'+
      '<div class="rq">'+
        '<span class="tag no">Wrong ×'+m.timesWrong+'</span>'+
        (m.mastered ? '<span class="tag ok">Mastered</span>' : '')+
        'Q'+q.id+'. '+esc(q.question)+
      '</div>'+
      '<div class="ra">Your answer: <strong>'+esc(m.userAnswer||"—")+'</strong></div>'+
      '<div class="ra">Correct answer: <strong>'+esc(m.correctAnswer||"—")+'</strong></div>'+
      '<div class="ra" style="color:var(--text)">💡 '+q.explanation+'</div>'+
      '<div class="ra" style="font-size:12px">'+
        '<span class="pill">Part '+q.part+'</span>'+
        (m.lastDate? ' Last attempted: '+esc(m.lastDate) : '')+
      '</div>'+
    '</div>';
  });
  return html;
}

/* ==========================================================
   15. INIT
   ========================================================== */
render();
</script>
</body>
</html>
